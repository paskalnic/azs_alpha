# Déploiement Netlify.
#
# Chaque poussée sur la branche de production déclenche ce build : le site est
# reconstruit et republié. C'est ce qui donnera son sens au bouton
# « Enregistrer » du back-office, dont chaque enregistrement écrira un commit.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les fichiers versionnés portent une empreinte dans leur nom : ils peuvent
# être mis en cache indéfiniment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le HTML, lui, doit être revalidé pour qu'une republication soit visible.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
