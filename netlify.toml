# Déploiement Netlify.
#
# Chaque poussée sur la branche de production déclenche ce build : le site est
# reconstruit et republié. C'est ce qui donnera son sens au bouton
# « Enregistrer » du back-office, dont chaque enregistrement écrira un commit.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirections héritées de l'ancien site.
#
# Le nouveau site reprend 25 des 26 adresses du WordPress qu'il remplace :
# c'est volontaire, et c'est ce qui fait qu'une refonte ne repart pas de zéro
# dans Google. L'ancienneté et les liens entrants sont attachés à l'URL, pas
# au serveur ni au contenu.
#
# `/inscription-formation/` est la seule exception : la page portait un
# formulaire d'inscription, remplacé par celui de /contact/. Sans cette
# redirection elle renverrait un 404 — Google retirerait la page de son index,
# et toute personne qui en a gardé le lien tomberait sur une erreur.
#
# 301 et non 302 : le déplacement est définitif, et c'est le seul code qui
# transmette à la nouvelle page le crédit accumulé par l'ancienne.
#
# Pas de `force` : la règle ne s'applique que si aucun fichier ne répond à ce
# chemin. Le jour où une vraie page `/inscription-formation/` reviendrait, elle
# reprendrait la main sans qu'on ait à y penser.
[[redirects]]
  from = "/inscription-formation/"
  to = "/contact/"
  status = 301

# La même sans barre oblique finale : Netlify traite les deux formes comme
# équivalentes, mais l'écrire coûte une ligne et ne dépend d'aucun réglage.
[[redirects]]
  from = "/inscription-formation"
  to = "/contact/"
  status = 301

# Les fichiers versionnés portent une empreinte dans leur nom : ils peuvent
# être mis en cache indéfiniment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les polices portent leur version dans leur nom : même traitement.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le HTML, lui, doit être revalidé pour qu'une republication soit visible.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le back-office peut contenir un jeton temporaire en mémoire navigateur : ses
# réponses ne doivent jamais être conservées par un cache intermédiaire.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
