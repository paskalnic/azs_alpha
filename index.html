<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4FAFD">
  <!-- Marque le document comme « JS actif » avant le premier rendu :
       sans JavaScript, les blocs `.reveal` restent visibles. -->
  <script>document.documentElement.className += ' js';</script>
  <!-- Polices servies par le site lui-même (voir src/styles/fonts.css).
       Préchargées : le navigateur les découvrirait sinon seulement après
       avoir analysé la feuille de style, soit un aller-retour de retard. -->
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/karla-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!--app-head-->
</head>
<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.jsx"></script>
</body>
</html>
